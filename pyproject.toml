[project]
name = "comfyui-k2-editorial"
version = "1.20.17"
description = "ComfyUI 节点：Krea2 白垩光长文提示词自动装配 · 395 母题 × 2432 角色 · 一个母题决定整张画面 · 纯本地零联网"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []
keywords = ["comfyui", "krea2", "prompt-generator", "prompt-engineering", "editorial", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/lingdongbudong/Comfyui-K2-Editorial"
Issues = "https://github.com/lingdongbudong/Comfyui-K2-Editorial/issues"

[tool.comfy]
PublisherId = "lingdongbudong"
DisplayName = "K2 长文出题 · 白垩光"
Icon = ""
# 内置素材约 47 MB（角色立绘 29 MB + 母题预览 11 MB + 数据 7 MB）。
# Registry 有单包上限，超限时把 thumbs/ 加进这里的排除列表。
includes = []
